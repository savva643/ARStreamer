workflows:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    environment:
      vars:
        XCODE_PROJECT: "ARStreamer.xcodeproj"
        XCODE_SCHEME: "ARStreamer"
      xcode: latest
    scripts:
      - name: Build .app without signing
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .app into .ipa
        script: |
          # Находим собранный .app
          APP_PATH=$(find ./build -name "ARStreamer.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found"
            exit 1
          fi
          echo "✅ Found .app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ARStreamer.ipa Payload
          ls -lh ARStreamer.ipa
    artifacts:
      - ARStreamer.ipa